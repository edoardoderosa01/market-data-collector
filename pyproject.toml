[project]
name = "market-data-collector"
version = "0.1.0"
description = "24/7 L2 order book collector for Binance USDⓈ-M and Hyperliquid perps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "websockets>=17.1",
]

[project.scripts]
market-data-collector = "market_data_collector.main:run"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
notebook = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "FURB", "ASYNC", "BLE", "T20"]
